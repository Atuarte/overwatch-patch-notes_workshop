                    <div class="cartao-heroi"><div class="moldura-imagem"><img src="Imagem dos Heróis/Brigitte.png" alt="Brigitte"></div><div class="nome-heroi">Brigitte</div></div>
                    <div class="cartao-heroi"><div class="moldura-imagem"><img src="Imagem dos Heróis/Illari.png" alt="Illari"></div><div class="nome-heroi">Illari</div></div>
                    <div class="cartao-heroi sem-mudanca"><div class="moldura-imagem"><img src="Imagem dos Heróis/Jetpack Cat.png" alt="Jetpack Cat"></div><div class="nome-heroi">Jetpack Cat</div></div>
                    <div class="cartao-heroi"><div class="moldura-imagem"><img src="Imagem dos Heróis/Juno.png" alt="Juno"></div><div class="nome-heroi">Juno</div></div>

                    <div class="cartao-heroi"><div class="moldura-imagem"><img src="Imagem dos Heróis/Lifeweaver.png" alt="Lifeweaver"></div><div class="nome-heroi">Lifeweaver</div></div>
                    <div class="cartao-heroi"><div class="moldura-imagem"><img src="Imagem dos Heróis/Lúcio.png" alt="Lúcio"></div><div class="nome-heroi">Lúcio</div></div>
                    <div class="cartao-heroi"><div class="moldura-imagem"><img src="Imagem dos Heróis/Mercy.png" alt="Mercy"></div><div class="nome-heroi">Mercy</div></div>
                    <div class="cartao-heroi"><div class="moldura-imagem"><img src="Imagem dos Heróis/Mizuki.png" alt="Mizuki"></div><div class="nome-heroi">Mizuki</div></div>
                    <div class="cartao-heroi"><div class="moldura-imagem"><img src="Imagem dos Heróis/Moira.png" alt="Moira"></div><div class="nome-heroi">Moira</div></div>
                    
                    <div class="cartao-heroi sem-mudanca"><div class="moldura-imagem"><img src="Imagem dos Heróis/Wuyang.png" alt="Wuyang"></div><div class="nome-heroi">Wuyang</div></div>
                    <div class="cartao-heroi"><div class="moldura-imagem"><img src="Imagem dos Heróis/Zenyatta.png" alt="Zenyatta"></div><div class="nome-heroi">Zenyatta</div></div>

                </div>
            </div>
        </main>
    </div>

    <script>
        const bancoDeDados = {
            "D.Va": {
                img: "Imagem dos Heróis/D.Va.png",
                texto: "<h3>OFENSIVA</h3><ul><li>Tamanho e hitbox reduzido em -3%.</li><li>Velocidade: +10%.</li></ul>"
            },
            "Doomfist": {
                img: "Imagem dos Heróis/Doomfist.png",
                texto: "<h3>OFENSIVA</h3><p>Soco recarrega em 3.4s.</p>"
            }
        };

        function abrirModal(nome) {
            const data = bancoDeDados[nome];
            const modal = document.getElementById('modal-heroi');
            
            // Monta o visual igual ao seu modelo
            document.getElementById('conteudo-modal').innerHTML = `
                <div class="modal-header">
                    <img src="${data.img}" alt="${nome}">
                    <h2>${nome}</h2>
                </div>
                <div class="modal-body">
                    ${data.texto}
                </div>
            `;
            
            modal.style.display = "flex"; // Mostra o modal
        }
    </script>

</body>
</html>
